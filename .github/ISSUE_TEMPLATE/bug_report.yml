name: Bug report
description: Report a problem with AntiBotPCExplorer.
title: "[Bug] "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Application version
      placeholder: 1.4.0
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version and build
      placeholder: Windows 11 x64, build ...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Describe the page or operation and the steps that trigger the problem.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or privacy-safe report excerpts
      description: Keep identifiers hidden in screenshots and review report excerpts before sharing.
